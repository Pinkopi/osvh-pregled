<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JU OŠ "Velešićki heroji"</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>:root { --green:#1f8a4d; --gold:#f0b429; --orange:#e85d04; --ink:#1c2430; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; color:var(--ink); font-family:Manrope,sans-serif; overflow:hidden; background:#123; }
a { color:inherit; }
.stage { position:fixed; inset:-6%; z-index:0; background-position:center; background-size:cover; background-repeat:no-repeat; }
header { position:fixed; z-index:30; top:0; left:0; right:0; display:flex; gap:8px; align-items:center; padding:10px 12px; flex-wrap:wrap; }
.brand,nav a { background:#fff; color:#1c2430; border-radius:999px; text-decoration:none; font-weight:800; }
.brand { padding:.4rem .7rem; }
nav { margin-left:auto; display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end; }
nav a { padding:7px 10px; font-size:13px; }
nav a[aria-current="page"] { background:#1f8a4d; color:#fff; }
.world { position:fixed; z-index:2; inset:0; padding:92px 4vw 34vh; overflow:auto; }
.sky { text-align:center; max-width:980px; margin:2vh auto 0; }
h1 { margin:.1rem 0; font-family:Fraunces,serif; font-size:clamp(3.2rem,11vw,8rem); line-height:.84; text-shadow:0 6px 0 #1233; }
h1 .g { color:#1f8a4d; display:block; }
h1 .y { color:#f0b429; display:block; }
.kicker { font-weight:800; letter-spacing:.12em; color:#f0b429; text-shadow:0 2px 0 #1238; }
.lead { font-size:1.15rem; max-width:40rem; margin:10px auto 0; color:#123; background:#fff4d4; display:inline-block; border-radius:16px; padding:.45rem .8rem; }
.go { display:inline-block; margin-top:0; background:#e85d04; color:#1c2430; font-weight:800; text-decoration:none; border-radius:999px; padding:.55rem .9rem; }
.portal { position:fixed; z-index:20; left:50%; bottom:24px; width:min(780px,86vw); height:22vh; margin-left:calc(min(780px,86vw) / -2); border-radius:46%; overflow:hidden; text-decoration:none; color:#fff; box-shadow:0 0 0 10px #fff; background:linear-gradient(#f0b429,#e85d04); }
.portal span { position:absolute; left:50%; top:12px; transform:translateX(-50%); background:#1f8a4d; color:#fff; font-weight:800; border-radius:999px; padding:.35rem .7rem; }
</style>
</head>
<body class="home">
<div class="stage" id="stage" style="background:#163a28"></div>
<header>
  <a class="brand" href="#">JU OŠ "Velešićki heroji"</a>
  <a class="go" href="#kontakt">Upis u školu</a>
  <nav aria-label="Stranice"><a href="#" aria-current="page">Početna</a><a href="#o-skoli">O školi</a><a href="#novosti">Novosti</a><a href="#obavjestenja">Obavještenja</a><a href="#nastava">Nastava</a><a href="#dokumenti">Dokumenti</a><a href="#konkursi">Konkursi</a><a href="#kontakt">Kontakt</a></nav>
</header>
<div class="world" id="world"><div class="sky">
  <p class="kicker">UČENICIMA STVARAMO PRILIKE</p>
  <h1><span class="g">VELEŠIĆKI</span><span class="y">HEROJI</span></h1>
  <p class="lead">Poštovani profesori, roditelji i učenici dobrodošli na našu web stranicu!</p>
  <a class="go" href="#kontakt">Upis u školu</a>
</div></div>
<a class="portal" id="portal" href="#o-skoli"><span>O školi</span></a>
</body></html>
